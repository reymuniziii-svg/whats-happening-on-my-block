name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Use the official Playwright image: Chromium + system deps are pre-installed,
    # so CI never downloads browsers from cdn.playwright.dev (that download stalls
    # reliably on the hosted runners). Tag must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm run test

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
